# ==============================================================================
# InsightPilot AI — Render Blueprint Deployment Specification
# ==============================================================================
# Use this Blueprint to deploy the FastAPI backend on Render with zero manual setup.
# Docs: https://render.com/docs/infrastructure-as-code

services:
  - type: web
    name: insightpilot-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --workers 2"
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      - key: CORS_ORIGINS
        value: "http://localhost:3000,http://127.0.0.1:3000"
      - key: CONFIDENCE_ABSTENTION_THRESHOLD
        value: "0.65"
      - key: MATERIALITY_VARIANCE_THRESHOLD
        value: "-0.03"
      - key: GROQ_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_1
        sync: false
